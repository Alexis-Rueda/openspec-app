<section class="os-section">
  <div class="os-container">
    <div class="section-head">
      <span class="cta-eyebrow">{{ data().eyebrow }}</span>
      <h2 class="cta-title os-text-balance">{{ data().title }}</h2>
    </div>
    <div class="cta-command-box">
      <code class="cta-command">{{ data().command }}</code>
      <button
        class="cta-copy"
        (click)="copyCommand()"
        [attr.aria-label]="copied() ? 'Copiado' : 'Copiar comando'">
        @if (copied()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        }
      </button>
    </div>
    <a class="cta-link" [href]="data().link.href" target="_blank" rel="noopener">{{ data().link.label }}</a>
  </div>
</section>
